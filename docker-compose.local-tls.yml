services:
  app:
    environment:
      NEXORA_TLS_GATEWAY_HEALTH_URL: http://tls-gateway:8081

  tls-gateway:
    image: ${NEXORA_NGINX_IMAGE:-nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NEXORA_HTTP_BIND_ADDRESS:-0.0.0.0}:${NEXORA_HTTP_PORT:-80}:8080"
      - "${NEXORA_HTTPS_BIND_ADDRESS:-0.0.0.0}:${NEXORA_HTTPS_PORT:-443}:8443"
    volumes:
      - ./deploy/nginx/nexora-tls.conf:/etc/nginx/nginx.conf:ro
      - ${NEXORA_TLS_CERT_DIR:?Set NEXORA_TLS_CERT_DIR}:/etc/nginx/tls:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-check-certificate --quiet --output-document=/dev/null https://127.0.0.1:8443/gateway-healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
