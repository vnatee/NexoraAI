services:
  minio:
    image: ${NEXORA_MINIO_IMAGE:-minio/minio:RELEASE.2025-07-23T15-54-02Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${NEXORA_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${NEXORA_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - nexora_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  nexora_minio_data:
