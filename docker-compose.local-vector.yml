services:
  qdrant:
    image: ${NEXORA_QDRANT_IMAGE:-qdrant/qdrant:v1.15.5}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXORA_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${NEXORA_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - nexora_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  nexora_qdrant_data:
